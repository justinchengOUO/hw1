<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>霓虹打磚塊 - Cyber Brick Breaker & Shop</title>
    <!-- Tailwind CSS for gorgeous neon arcade UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #030712;
            font-family: 'Inter', sans-serif;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        .neon-glow {
            text-shadow: 0 0 10px rgba(6, 182, 212, 0.7), 0 0 20px rgba(6, 182, 212, 0.5);
        }
        .neon-box {
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.4), inset 0 0 15px rgba(6, 182, 212, 0.15);
        }
    </style>
</head>
<body class="relative select-none text-white">

    <!-- HUD Overlay -->
    <div id="hud" class="absolute top-0 left-0 w-full p-4 flex justify-between items-center pointer-events-none z-10 text-lg md:text-xl font-bold tracking-wider">
        <div class="flex items-center gap-4">
            <div class="bg-slate-900/80 backdrop-blur px-4 py-2 rounded-xl border border-cyan-500/30">
                分數: <span id="scoreDisplay" class="text-cyan-400">0</span>
            </div>
            <div class="bg-slate-900/80 backdrop-blur px-4 py-2 rounded-xl border border-rose-500/30 flex items-center gap-1">
                生命: <span id="healthDisplay" class="text-rose-400">❤️❤️❤️</span>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <div class="bg-slate-900/80 backdrop-blur px-4 py-2 rounded-xl border border-amber-500/30">
                金幣: <span id="coinsDisplay" class="text-amber-400">0</span> 🪙
            </div>
            <div class="bg-slate-900/80 backdrop-blur px-4 py-2 rounded-xl border border-indigo-500/30">
                關卡: <span id="levelDisplay" class="text-indigo-400">1</span>
            </div>
        </div>
    </div>

    <!-- Start Menu Modal -->
    <div id="startScreen" class="absolute inset-0 bg-slate-950/90 backdrop-blur-md flex flex-col items-center justify-center z-30 transition-opacity duration-300">
        <div class="text-center max-w-lg px-6">
            <h1 class="text-5xl md:text-6xl font-black mb-4 bg-gradient-to-r from-cyan-400 via-indigo-400 to-rose-500 bg-clip-text text-transparent neon-glow">
                CYBER BREAKER
            </h1>
            <p class="text-slate-300 mb-8 text-sm md:text-base leading-relaxed">
                經典打磚塊全新進化！支援「雙倍球」分裂技能、自動雷射、擴充彈板及豐富商店升級系統。賺取金幣稱霸太空！
            </p>
            <button id="startBtn" class="px-8 py-4 bg-gradient-to-r from-cyan-500 to-indigo-600 rounded-2xl font-bold text-lg shadow-xl shadow-cyan-500/30 hover:scale-105 active:scale-95 transition-all cursor-pointer pointer-events-auto">
                開始冒險
            </button>
        </div>
    </div>

    <!-- Upgrade Shop Modal (店勁風 / 商店系統) -->
    <div id="shopScreen" class="absolute inset-0 bg-slate-950/90 backdrop-blur-md flex flex-col items-center justify-center z-30 hidden transition-opacity duration-300">
        <div class="bg-slate-900/95 border border-cyan-500/40 neon-box p-6 md:p-8 rounded-3xl max-w-lg w-full mx-4 shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl md:text-3xl font-black text-cyan-400 neon-glow">商店強化站</h2>
                <div class="bg-amber-500/20 border border-amber-500/40 px-3 py-1.5 rounded-xl text-amber-300 font-bold">
                    金幣: <span id="shopCoins">0</span> 🪙
                </div>
            </div>

            <div class="space-y-3.5 mb-6 max-h-[60vh] overflow-y-auto pr-1">
                <!-- Upgrade Item: Split Ball (雙倍球技能) -->
                <div class="flex items-center justify-between bg-slate-800/70 p-3.5 rounded-2xl border border-indigo-500/40">
                    <div>
                        <div class="font-bold text-indigo-300">✨ 雙倍球分裂技</div>
                        <div class="text-xs text-slate-400">解鎖強力雙球連打（場上球數直接翻倍）</div>
                    </div>
                    <button id="buySplitBall" onclick="buyUpgrade('splitBall')" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-bold rounded-xl shadow-lg shadow-indigo-600/30 transition-all cursor-pointer">
                        購買 (<span id="costSplitBall">100</span> 🪙)
                    </button>
                </div>

                <!-- Upgrade Item: Paddle -->
                <div class="flex items-center justify-between bg-slate-800/60 p-3.5 rounded-2xl border border-slate-700">
                    <div>
                        <div class="font-bold text-slate-200">擴充彈板</div>
                        <div class="text-xs text-slate-400">增加彈板寬度，更容易接球</div>
                    </div>
                    <button id="buyPaddle" onclick="buyUpgrade('paddle')" class="px-4 py-2 bg-cyan-600 hover:bg-cyan-500 text-white text-sm font-bold rounded-xl shadow-lg shadow-cyan-600/30 transition-all cursor-pointer">
                        購買 (<span id="costPaddle">50</span> 🪙)
                    </button>
                </div>

                <!-- Upgrade Item: Laser -->
                <div class="flex items-center justify-between bg-slate-800/60 p-3.5 rounded-2xl border border-slate-700">
                    <div>
                        <div class="font-bold text-slate-200">雷射發射器</div>
                        <div class="text-xs text-slate-400">彈板自動向前發射雷射消滅磚塊</div>
                    </div>
                    <button id="buyLaser" onclick="buyUpgrade('laser')" class="px-4 py-2 bg-rose-600 hover:bg-rose-500 text-white text-sm font-bold rounded-xl shadow-lg shadow-rose-600/30 transition-all cursor-pointer">
                        購買 (<span id="costLaser">150</span> 🪙)
                    </button>
                </div>

                <!-- Upgrade Item: Life -->
                <div class="flex items-center justify-between bg-slate-800/60 p-3.5 rounded-2xl border border-slate-700">
                    <div>
                        <div class="font-bold text-slate-200">額外生命</div>
                        <div class="text-xs text-slate-400">增加 1 點防護生命值</div>
                    </div>
                    <button id="buyLife" onclick="buyUpgrade('life')" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-bold rounded-xl shadow-lg shadow-emerald-600/30 transition-all cursor-pointer">
                        購買 (<span id="costLife">100</span> 🪙)
                    </button>
                </div>
            </div>

            <button id="nextLevelBtn" class="w-full py-4 bg-gradient-to-r from-emerald-500 to-cyan-600 rounded-2xl font-bold text-lg shadow-xl shadow-emerald-500/30 hover:scale-[1.02] active:scale-95 transition-all cursor-pointer">
                進入下一關
            </button>
        </div>
    </div>

    <!-- Game Over Screen Modal -->
    <div id="gameOverScreen" class="absolute inset-0 bg-slate-950/90 backdrop-blur-md flex flex-col items-center justify-center z-30 hidden transition-opacity duration-300">
        <div class="text-center max-w-lg px-6">
            <h2 class="text-4xl md:text-5xl font-black mb-2 text-rose-500 drop-shadow-lg">
                遊戲結束
            </h2>
            <p class="text-slate-400 mb-6 text-lg">能量耗盡，防線崩潰...</p>
            <div class="bg-slate-900/80 p-6 rounded-2xl border border-slate-800 mb-8">
                <p class="text-slate-300 mb-2">最終得分</p>
                <div id="finalScore" class="text-4xl font-black text-cyan-400">0</div>
            </div>
            <button id="restartBtn" class="px-8 py-4 bg-gradient-to-r from-rose-500 to-indigo-600 rounded-2xl font-bold text-lg shadow-xl shadow-rose-500/30 hover:scale-105 active:scale-95 transition-all cursor-pointer pointer-events-auto">
                重新開始
            </button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        // --- Web Audio API Sound Synthesizer ---
        class SoundSystem {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }
            playBounce() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, this.ctx.currentTime + 0.08);
                
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            }
            playBrickHit(isSpecial = false) {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = isSpecial ? 'triangle' : 'square';
                osc.frequency.setValueAtTime(isSpecial ? 600 : 440, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(isSpecial ? 1200 : 880, this.ctx.currentTime + 0.1);
                
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            }
            playPowerup() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(900, this.ctx.currentTime + 0.25);
                
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.25);
            }
            playLaser() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(900, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(300, this.ctx.currentTime + 0.1);
                
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            }
        }

        const sounds = new SoundSystem();

        // --- Canvas & Core Variables ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        let gameState = 'START'; // START, PLAYING, SHOP, GAMEOVER
        let score = 0;
        let health = 3;
        let coins = 0;
        let level = 1;

        // Upgrades & Skills
        let upgrades = {
            hasSplitBall: false,
            paddleLevel: 0,
            hasLaser: false
        };
        let upgradeCosts = {
            splitBall: 1000,
            paddle: 50,
            laser: 150,
            life: 100
        };

        // Input tracking
        const keys = {};
        let mouseX = width / 2;
        let isPointerDown = false;

        window.addEventListener('keydown', e => { 
            keys[e.code] = true; 
            // Quick trigger split ball skill if unlocked via keyboard (KeyS or KeyB)
            if ((e.code === 'KeyB' || e.code === 'KeyS') && upgrades.hasSplitBall && gameState === 'PLAYING') {
                triggerSplitBallSkill();
            }
        });
        window.addEventListener('keyup', e => { keys[e.code] = false; });

        window.addEventListener('mousemove', e => {
            mouseX = e.clientX;
            isPointerDown = true;
        });

        window.addEventListener('touchmove', e => {
            if (e.touches.length > 0) {
                mouseX = e.touches[0].clientX;
                isPointerDown = true;
            }
        }, { passive: true });

        // --- Game Entities ---
        class Paddle {
            constructor() {
                this.width = 120;
                this.height = 18;
                this.x = width / 2 - this.width / 2;
                this.y = height - 50;
                this.speed = 10;
                this.laserCooldown = 0;
            }

            update() {
                if (keys['ArrowLeft'] || keys['KeyA']) this.x -= this.speed;
                if (keys['ArrowRight'] || keys['KeyD']) this.x += this.speed;

                if (isPointerDown) {
                    this.x += (mouseX - this.width / 2 - this.x) * 0.2;
                }

                this.x = Math.max(0, Math.min(width - this.width, this.x));

                // Laser shooting
                if (upgrades.hasLaser) {
                    this.laserCooldown++;
                    if (this.laserCooldown >= 30) {
                        this.laserCooldown = 0;
                        lasers.push(new Laser(this.x + 15, this.y));
                        lasers.push(new Laser(this.x + this.width - 15, this.y));
                        sounds.playLaser();
                    }
                }
            }

            draw() {
                ctx.save();
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#06b6d4';
                ctx.fillStyle = '#22d3ee';
                
                ctx.beginPath();
                ctx.roundRect(this.x, this.y, this.width, this.height, 9);
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.fillRect(this.x + this.width / 2 - 15, this.y + 4, 30, 4);

                if (upgrades.hasLaser) {
                    ctx.fillStyle = '#f43f5e';
                    ctx.fillRect(this.x + 10, this.y - 6, 6, 8);
                    ctx.fillRect(this.x + this.width - 16, this.y - 6, 6, 8);
                }

                ctx.restore();
            }
        }

        class Ball {
            constructor(x = null, y = null, vx = null, vy = null) {
                this.radius = 8;
                if (x !== null && y !== null) {
                    this.x = x;
                    this.y = y;
                    this.vx = vx;
                    this.vy = vy;
                    this.active = true;
                } else {
                    this.reset();
                }
            }

            reset() {
                this.x = width / 2;
                this.y = height - 90;
                const angle = (Math.random() * 0.6 - 0.3) * Math.PI;
                const speed = 6 + (level * 0.3);
                this.vx = Math.sin(angle) * speed;
                this.vy = -Math.cos(angle) * speed;
                this.active = false;
            }

            update() {
                if (!this.active) {
                    this.x = paddle.x + paddle.width / 2;
                    this.y = paddle.y - this.radius - 2;
                    if (keys['Space'] || isPointerDown) {
                        this.active = true;
                    }
                    return;
                }

                this.x += this.vx;
                this.y += this.vy;

                // Wall collisions
                if (this.x - this.radius < 0) {
                    this.x = this.radius;
                    this.vx *= -1;
                    sounds.playBounce();
                }
                if (this.x + this.radius > width) {
                    this.x = width - this.radius;
                    this.vx *= -1;
                    sounds.playBounce();
                }
                if (this.y - this.radius < 0) {
                    this.y = this.radius;
                    this.vy *= -1;
                    sounds.playBounce();
                }

                // Paddle collision
                if (
                    this.x + this.radius >= paddle.x &&
                    this.x - this.radius <= paddle.x + paddle.width &&
                    this.y + this.radius >= paddle.y &&
                    this.y - this.radius <= paddle.y + paddle.height
                ) {
                    sounds.playBounce();
                    this.y = paddle.y - this.radius;
                    const hitPoint = (this.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
                    const speed = Math.hypot(this.vx, this.vy);
                    const angle = hitPoint * (Math.PI / 3);
                    this.vx = Math.sin(angle) * speed;
                    this.vy = -Math.cos(angle) * speed;
                }
            }

            draw() {
                ctx.save();
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#38bdf8';
                ctx.fillStyle = '#bae6fd';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class Laser {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 4;
                this.height = 16;
                this.speed = 12;
            }
            update() {
                this.y -= this.speed;
            }
            draw() {
                ctx.save();
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#f43f5e';
                ctx.fillStyle = '#fb7185';
                ctx.fillRect(this.x - this.width / 2, this.y, this.width, this.height);
                ctx.restore();
            }
        }

        class Brick {
            constructor(x, y, w, h, color, points, hp = 1, isPowerup = false) {
                this.x = x;
                this.y = y;
                this.width = w;
                this.height = h;
                this.color = color;
                this.points = points;
                this.hp = hp;
                this.maxHp = hp;
                this.isPowerup = isPowerup;
                this.alive = true;
            }

            draw() {
                if (!this.alive) return;
                ctx.save();
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.globalAlpha = 0.4 + 0.6 * (this.hp / this.maxHp);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.roundRect(this.x, this.y, this.width, this.height, 6);
                ctx.fill();

                if (this.isPowerup) {
                    ctx.fillStyle = '#ffffff';
                    ctx.font = '12px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('⭐', this.x + this.width / 2, this.y + this.height / 2);
                }
                ctx.restore();
            }
        }

        class PowerUp {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.radius = 12;
                this.type = type; // 'coin', 'life', 'split'
                this.speed = 3;
            }

            update() {
                this.y += this.speed;
            }

            draw() {
                ctx.save();
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#fbbf24';
                ctx.fillStyle = '#f59e0b';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.font = '12px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.type === 'coin' ? '🪙' : (this.type === 'split' ? '✨' : '➕'), this.x, this.y);
                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 4 + 1;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.decay = Math.random() * 0.04 + 0.02;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // --- Collections ---
        let paddle = new Paddle();
        let balls = [new Ball()];
        let bricks = [];
        let lasers = [];
        let powerUps = [];
        let particles = [];

        function initBricks() {
            bricks = [];
            const rows = 5 + Math.min(3, level);
            const cols = Math.floor(width / 90);
            const brickWidth = (width - (cols + 1) * 10) / cols;
            const brickHeight = 24;
            const colors = ['#f43f5e', '#fb923c', '#facc15', '#34d399', '#38bdf8', '#818cf8', '#e879f9'];

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const bx = c * (brickWidth + 10) + 10;
                    const by = r * (brickHeight + 8) + 70;
                    const color = colors[r % colors.length];
                    const hp = r === 0 ? 2 : 1;
                    const isPowerup = Math.random() < 0.12;
                    bricks.push(new Brick(bx, by, brickWidth, brickHeight, color, (rows - r) * 10, hp, isPowerup));
                }
            }
        }

        function spawnExplosion(x, y, color) {
            for (let i = 0; i < 15; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function updateHUD() {
            document.getElementById('scoreDisplay').innerText = score;
            document.getElementById('healthDisplay').innerText = '❤️❤️❤️️'.slice(0, health);
            document.getElementById('coinsDisplay').innerText = coins;
            document.getElementById('levelDisplay').innerText = level;
        }

        // --- 雙倍球分裂技能邏輯 ---
        function triggerSplitBallSkill() {
            sounds.playPowerup();
            let newBalls = [];
            balls.forEach(b => {
                if (b.active) {
                    const speed = Math.hypot(b.vx, b.vy);
                    const currentAngle = Math.atan2(b.vy, b.vx);
                    // 分裂成夾角 30 度的兩顆球
                    const angle1 = currentAngle - 0.25;
                    const angle2 = currentAngle + 0.25;
                    newBalls.push(new Ball(b.x, b.y, Math.cos(angle1) * speed, Math.sin(angle1) * speed));
                    newBalls.push(new Ball(b.x, b.y, Math.cos(angle2) * speed, Math.sin(angle2) * speed));
                } else {
                    newBalls.push(b);
                }
            });
            balls = newBalls;
        }

        // --- Shop Management ---
        function openShop() {
            gameState = 'SHOP';
            document.getElementById('shopCoins').innerText = coins;
            document.getElementById('costSplitBall').innerText = upgradeCosts.splitBall;
            document.getElementById('costPaddle').innerText = upgradeCosts.paddle;
            document.getElementById('costLaser').innerText = upgradeCosts.laser;
            document.getElementById('costLife').innerText = upgradeCosts.life;
            
            // Highlight if player can buy split ball
            const splitBtn = document.getElementById('buySplitBall');
            if (upgrades.hasSplitBall) {
                splitBtn.innerText = '已解鎖';
                splitBtn.disabled = true;
                splitBtn.classList.add('opacity-50', 'cursor-not-allowed');
            }
            
            document.getElementById('shopScreen').classList.remove('hidden');
        }

        window.buyUpgrade = function(type) {
            sounds.init();
            if (type === 'splitBall' && !upgrades.hasSplitBall && coins >= upgradeCosts.splitBall) {
                coins -= upgradeCosts.splitBall;
                upgrades.hasSplitBall = true;
                sounds.playPowerup();
                const splitBtn = document.getElementById('buySplitBall');
                splitBtn.innerText = '已解鎖';
                splitBtn.disabled = true;
                splitBtn.classList.add('opacity-50', 'cursor-not-allowed');
            } else if (type === 'paddle' && coins >= upgradeCosts.paddle) {
                coins -= upgradeCosts.paddle;
                upgrades.paddleLevel++;
                paddle.width += 25;
                upgradeCosts.paddle = Math.floor(upgradeCosts.paddle * 1.5);
                sounds.playPowerup();
            } else if (type === 'laser' && !upgrades.hasLaser && coins >= upgradeCosts.laser) {
                coins -= upgradeCosts.laser;
                upgrades.hasLaser = true;
                sounds.playPowerup();
            } else if (type === 'life' && coins >= upgradeCosts.life) {
                coins -= upgradeCosts.life;
                health++;
                upgradeCosts.life = Math.floor(upgradeCosts.life * 1.4);
                sounds.playPowerup();
            }
            document.getElementById('shopCoins').innerText = coins;
            document.getElementById('costPaddle').innerText = upgradeCosts.paddle;
            document.getElementById('costLaser').innerText = upgradeCosts.laser;
            document.getElementById('costLife').innerText = upgradeCosts.life;
            updateHUD();
        }

        document.getElementById('nextLevelBtn').addEventListener('click', () => {
            document.getElementById('shopScreen').classList.add('hidden');
            level++;
            paddle.width = 120 + (upgrades.paddleLevel * 25);
            initBricks();
            balls = [new Ball()];
            gameState = 'PLAYING';
            updateHUD();
            gameLoop();
        });

        // --- Main Game Loop ---
        function resetGame() {
            score = 0;
            health = 3;
            coins = 0;
            level = 1;
            upgrades = { hasSplitBall: false, paddleLevel: 0, hasLaser: false };
            upgradeCosts = { splitBall: 1000, paddle: 50, laser: 150, life: 100 };
            paddle = new Paddle();
            balls = [new Ball()];
            lasers = [];
            powerUps = [];
            particles = [];
            initBricks();
            updateHUD();
        }

        function gameLoop() {
            if (gameState !== 'PLAYING') return;

            // Clear Screen
            ctx.fillStyle = '#030712';
            ctx.fillRect(0, 0, width, height);

            // Update & Draw Paddle
            paddle.update();
            paddle.draw();

            // Update & Draw Balls
            for (let i = balls.length - 1; i >= 0; i--) {
                balls[i].update();
                balls[i].draw();
            }

            // Check if all balls are lost
            let activeBallsCount = balls.filter(b => b.active).length;
            if (balls.length > 0 && activeBallsCount === 0 && balls[0].active === false) {
                // Ball not launched yet
            } else if (balls.length > 0 && activeBallsCount === 0) {
                health--;
                updateHUD();
                balls = [new Ball()];
                if (health <= 0) {
                    triggerGameOver();
                }
            }

            // Update & Draw Lasers
            for (let i = lasers.length - 1; i >= 0; i--) {
                lasers[i].update();
                lasers[i].draw();

                let laserHit = false;
                for (let j = 0; j < bricks.length; j++) {
                    let brick = bricks[j];
                    if (brick.alive &&
                        lasers[i].x >= brick.x && lasers[i].x <= brick.x + brick.width &&
                        lasers[i].y >= brick.y && lasers[i].y <= brick.y + brick.height
                    ) {
                        brick.hp--;
                        laserHit = true;
                        if (brick.hp <= 0) {
                            brick.alive = false;
                            score += brick.points;
                            coins += 5;
                            spawnExplosion(brick.x + brick.width / 2, brick.y + brick.height / 2, brick.color);
                            sounds.playBrickHit(true);
                            if (brick.isPowerup) {
                                powerUps.push(new PowerUp(brick.x + brick.width / 2, brick.y + brick.height / 2, Math.random() < 0.5 ? 'coin' : 'split'));
                            }
                        } else {
                            sounds.playBrickHit(false);
                        }
                        break;
                    }
                }

                if (laserHit || lasers[i].y < 0) {
                    lasers.splice(i, 1);
                }
            }

            // Update & Draw Bricks & Ball-Brick Collisions
            let activeBricksCount = 0;
            for (let i = 0; i < bricks.length; i++) {
                let brick = bricks[i];
                brick.draw();
                if (!brick.alive) continue;
                activeBricksCount++;

                for (let j = 0; j < balls.length; j++) {
                    let ball = balls[j];
                    if (
                        ball.x + ball.radius >= brick.x &&
                        ball.x - ball.radius <= brick.x + brick.width &&
                        ball.y + ball.radius >= brick.y &&
                        ball.y - ball.radius <= brick.y + brick.height
                    ) {
                        brick.hp--;
                        ball.vy *= -1;
                        if (brick.hp <= 0) {
                            brick.alive = false;
                            score += brick.points;
                            coins += 10;
                            spawnExplosion(brick.x + brick.width / 2, brick.y + brick.height / 2, brick.color);
                            sounds.playBrickHit(true);
                            if (brick.isPowerup) {
                                powerUps.push(new PowerUp(brick.x + brick.width / 2, brick.y + brick.height / 2, Math.random() < 0.6 ? 'coin' : 'split'));
                            }
                        } else {
                            sounds.playBrickHit(false);
                        }
                    }
                }
            }

            // Remove fallen single balls from array if multiple exist
            balls = balls.filter(b => b.y <= height + 30);
            if (balls.length === 0) {
                health--;
                updateHUD();
                balls = [new Ball()];
                if (health <= 0) {
                    triggerGameOver();
                }
            }

            // Update & Draw PowerUps
            for (let i = powerUps.length - 1; i >= 0; i--) {
                powerUps[i].update();
                powerUps[i].draw();

                if (
                    powerUps[i].x >= paddle.x &&
                    powerUps[i].x <= paddle.x + paddle.width &&
                    powerUps[i].y + powerUps[i].radius >= paddle.y &&
                    powerUps[i].y - powerUps[i].radius <= paddle.y + paddle.height
                ) {
                    sounds.playPowerup();
                    if (powerUps[i].type === 'coin') {
                        coins += 35;
                    } else if (powerUps[i].type === 'split') {
                        triggerSplitBallSkill();
                    } else {
                        health++;
                    }
                    updateHUD();
                    powerUps.splice(i, 1);
                    continue;
                }

                if (powerUps[i].y > height) {
                    powerUps.splice(i, 1);
                }
            }

            // Update & Draw Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            updateHUD();

            // Check level clear
            if (activeBricksCount === 0) {
                openShop();
                return;
            }

            requestAnimationFrame(gameLoop);
        }

        function triggerGameOver() {
            gameState = 'GAMEOVER';
            document.getElementById('finalScore').innerText = score;
            document.getElementById('gameOverScreen').classList.remove('hidden');
        }

        // --- Button Handlers ---
        document.getElementById('startBtn').addEventListener('click', () => {
            sounds.init();
            gameState = 'PLAYING';
            document.getElementById('startScreen').classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => document.getElementById('startScreen').classList.add('hidden'), 300);
            resetGame();
            gameLoop();
        });

        document.getElementById('restartBtn').addEventListener('click', () => {
            sounds.init();
            document.getElementById('gameOverScreen').classList.add('opacity-0');
            setTimeout(() => {
                document.getElementById('gameOverScreen').classList.add('hidden');
                document.getElementById('gameOverScreen').classList.remove('opacity-0');
            }, 300);
            gameState = 'PLAYING';
            resetGame();
            gameLoop();
        });
    </script>
</body>
</html>
