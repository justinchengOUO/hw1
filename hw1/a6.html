<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太空射擊遊戲 - Cosmic Blaster</title>
    <!-- Tailwind CSS for modern UI styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050515;
            font-family: 'Inter', sans-serif;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body class="relative select-none text-white">

    <!-- HUD Overlay -->
    <div id="hud" class="absolute top-0 left-0 w-full p-4 flex justify-between items-center pointer-events-none z-10 text-xl font-bold tracking-wider drop-shadow-md">
        <div class="flex items-center gap-6">
            <div class="bg-slate-900/80 px-4 py-2 rounded-xl border border-cyan-500/30">
                分數: <span id="scoreDisplay" class="text-cyan-400">0</span>
            </div>
            <div class="bg-slate-900/80 px-4 py-2 rounded-xl border border-rose-500/30 flex items-center gap-2">
                生命: <span id="healthDisplay" class="text-rose-400">❤️❤️❤️</span>
            </div>
        </div>
        <div class="bg-slate-900/80 px-4 py-2 rounded-xl border border-amber-500/30">
            等級: <span id="levelDisplay" class="text-amber-400">1</span>
        </div>
    </div>

    <!-- Start Screen Modal -->
    <div id="startScreen" class="absolute inset-0 bg-slate-950/90 backdrop-blur-md flex flex-col items-center justify-center z-20 transition-opacity duration-300">
        <div class="text-center max-w-lg px-6">
            <h1 class="text-5xl md:text-6xl font-black mb-4 bg-gradient-to-r from-cyan-400 via-indigo-400 to-rose-500 bg-clip-text text-transparent drop-shadow-lg">
                COSMIC BLASTER
            </h1>
            <p class="text-slate-300 mb-8 text-sm md:text-base leading-relaxed">
                使用滑鼠、觸控拖曳或方向鍵移動戰機。自動發射雷射！消滅敵機，閃躲隕石，存活下去！
            </p>
            <button id="startBtn" class="group relative px-8 py-4 bg-gradient-to-r from-cyan-500 to-indigo-600 rounded-2xl font-bold text-lg shadow-xl shadow-indigo-500/30 hover:scale-105 active:scale-95 transition-all cursor-pointer">
                開始遊戲
            </button>
        </div>
    </div>

    <!-- Game Over Screen Modal -->
    <div id="gameOverScreen" class="absolute inset-0 bg-slate-950/90 backdrop-blur-md flex flex-col items-center justify-center z-20 hidden transition-opacity duration-300">
        <div class="text-center max-w-lg px-6">
            <h2 class="text-4xl md:text-5xl font-black mb-2 text-rose-500 drop-shadow-lg">
                遊戲結束
            </h2>
            <p class="text-slate-400 mb-6 text-lg">英雄殞落，宇宙陷入黑暗...</p>
            <div class="bg-slate-900/80 p-6 rounded-2xl border border-slate-800 mb-8">
                <p class="text-slate-300 mb-2">最終得分</p>
                <div id="finalScore" class="text-4xl font-black text-cyan-400">0</div>
            </div>
            <button id="restartBtn" class="px-8 py-4 bg-gradient-to-r from-rose-500 to-indigo-600 rounded-2xl font-bold text-lg shadow-xl shadow-rose-500/30 hover:scale-105 active:scale-95 transition-all cursor-pointer">
                再次挑戰
            </button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        // --- Web Audio API Sound Synthesizer ---
        class SoundSystem {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }
            playLaser() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(800, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.15);
                
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            }
            playExplosion() {
                if (!this.ctx) return;
                const bufferSize = this.ctx.sampleRate * 0.4;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;
                
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(600, this.ctx.currentTime);
                filter.frequency.linearRampToValueAtTime(50, this.ctx.currentTime + 0.4);
                
                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
                
                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                noise.start();
            }
            playHit() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(200, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, this.ctx.currentTime + 0.1);
                
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            }
        }

        const sounds = new SoundSystem();

        // --- Game Setup & Variables ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        let gameState = 'START'; // START, PLAYING, GAMEOVER
        let score = 0;
        let health = 3;
        let level = 1;
        let frameCount = 0;

        // Input state tracking
        const keys = {};
        let mouseX = width / 2;
        let mouseY = height - 100;
        let isPointerDown = false;

        window.addEventListener('keydown', e => { keys[e.code] = true; });
        window.addEventListener('keyup', e => { keys[e.code] = false; });

        window.addEventListener('mousemove', e => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            isPointerDown = true;
        });

        window.addEventListener('touchmove', e => {
            if (e.touches.length > 0) {
                mouseX = e.touches[0].clientX;
                mouseY = e.touches[0].clientY;
                isPointerDown = true;
            }
        }, { passive: true });

        // --- Game Entities ---
        class Player {
            constructor() {
                this.x = width / 2;
                this.y = height - 120;
                this.radius = 20;
                this.speed = 7;
                this.shootTimer = 0;
                this.shootInterval = 12; // frames between shots
            }

            update() {
                // Keyboard movement
                if (keys['ArrowLeft'] || keys['KeyA']) this.x -= this.speed;
                if (keys['ArrowRight'] || keys['KeyD']) this.x += this.speed;
                if (keys['ArrowUp'] || keys['KeyW']) this.y -= this.speed;
                if (keys['ArrowDown'] || keys['KeyS']) this.y += this.speed;

                // Pointer movement interpolation if active
                if (isPointerDown) {
                    this.x += (mouseX - this.x) * 0.15;
                    this.y += (mouseY - this.y) * 0.15;
                }

                // Boundaries
                this.x = Math.max(this.radius, Math.min(width - this.radius, this.x));
                this.y = Math.max(this.radius, Math.min(height - this.radius, this.y));

                // Auto shooting
                this.shootTimer++;
                if (this.shootTimer >= this.shootInterval) {
                    this.shootTimer = 0;
                    bullets.push(new Bullet(this.x, this.y - 15));
                    sounds.playLaser();
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                // Engine glow trail
                ctx.fillStyle = 'rgba(6, 182, 212, 0.4)';
                ctx.beginPath();
                ctx.arc(0, 15, 12 + Math.sin(frameCount * 0.3) * 3, 0, Math.PI * 2);
                ctx.fill();

                // Ship body
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#06b6d4';
                ctx.fillStyle = '#22d3ee';
                ctx.beginPath();
                ctx.moveTo(0, -22);
                ctx.lineTo(-18, 16);
                ctx.lineTo(-6, 10);
                ctx.lineTo(0, 14);
                ctx.lineTo(6, 10);
                ctx.lineTo(18, 16);
                ctx.closePath();
                ctx.fill();

                // Cockpit window
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.ellipse(0, -4, 4, 8, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        class Bullet {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 4;
                this.speed = 12;
            }

            update() {
                this.y -= this.speed;
            }

            draw() {
                ctx.save();
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#38bdf8';
                ctx.fillStyle = '#bae6fd';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class Enemy {
            constructor() {
                this.radius = Math.random() * 14 + 16;
                this.x = Math.random() * (width - this.radius * 2) + this.radius;
                this.y = -this.radius * 2;
                this.speed = Math.random() * 2 + 1.5 + (level * 0.4);
                this.health = Math.floor(this.radius / 10);
                this.maxHealth = this.health;
                this.angle = 0;
                this.spin = (Math.random() - 0.5) * 0.05;
            }

            update() {
                this.y += this.speed;
                this.angle += this.spin;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                ctx.shadowBlur = 12;
                ctx.shadowColor = '#f43f5e';
                ctx.fillStyle = '#fb7185';
                
                // Asteroid/Enemy shape polygon
                ctx.beginPath();
                const points = 6;
                for (let i = 0; i < points; i++) {
                    const a = (i * Math.PI * 2) / points;
                    const r = this.radius * (0.8 + Math.sin(i * 3) * 0.2);
                    const px = Math.cos(a) * r;
                    const py = Math.sin(a) * r;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.fill();

                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 1;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.decay = Math.random() * 0.03 + 0.02;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class Star {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2 + 0.5;
                this.speed = Math.random() * 1.5 + 0.5;
            }

            update() {
                this.y += this.speed;
                if (this.y > height) {
                    this.y = 0;
                    this.x = Math.random() * width;
                }
            }

            draw() {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.fillRect(this.x, this.y, this.size, this.size);
            }
        }

        // --- Game Collections ---
        let player = new Player();
        let bullets = [];
        let enemies = [];
        let particles = [];
        let stars = Array.from({ length: 100 }, () => new Star());

        function spawnExplosion(x, y, color = '#fb7185') {
            for (let i = 0; i < 20; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        // --- Main Game Loop ---
        function resetGame() {
            player = new Player();
            bullets = [];
            enemies = [];
            particles = [];
            score = 0;
            health = 3;
            level = 1;
            frameCount = 0;
            updateHUD();
        }

        function updateHUD() {
            document.getElementById('scoreDisplay').innerText = score;
            document.getElementById('healthDisplay').innerText = '❤️'.repeat(Math.max(0, health));
            document.getElementById('levelDisplay').innerText = level;
        }

        function gameLoop() {
            if (gameState !== 'PLAYING') return;

            frameCount++;
            level = Math.floor(score / 500) + 1;

            // Clear Canvas
            ctx.fillStyle = '#050515';
            ctx.fillRect(0, 0, width, height);

            // Update & Draw Background Stars
            stars.forEach(star => {
                star.update();
                star.draw();
            });

            // Enemy Spawner
            let spawnRate = Math.max(20, 60 - level * 5);
            if (frameCount % spawnRate === 0) {
                enemies.push(new Enemy());
            }

            // Update Player
            player.update();
            player.draw();

            // Update Bullets
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].update();
                bullets[i].draw();
                if (bullets[i].y < -20) {
                    bullets.splice(i, 1);
                }
            }

            // Update Enemies & Collisions
            for (let i = enemies.length - 1; i >= 0; i--) {
                let enemy = enemies[i];
                enemy.update();
                enemy.draw();

                // Check collision with player
                const distPlayer = Math.hypot(enemy.x - player.x, enemy.y - player.y);
                if (distPlayer < enemy.radius + player.radius) {
                    spawnExplosion(player.x, player.y, '#06b6d4');
                    sounds.playHit();
                    health--;
                    updateHUD();
                    enemies.splice(i, 1);

                    if (health <= 0) {
                        triggerGameOver();
                    }
                    continue;
                }

                // Check collision with bullets
                let enemyDestroyed = false;
                for (let j = bullets.length - 1; j >= 0; j--) {
                    let bullet = bullets[j];
                    const distBullet = Math.hypot(enemy.x - bullet.x, enemy.y - bullet.y);
                    if (distBullet < enemy.radius + bullet.radius) {
                        bullets.splice(j, 1);
                        enemy.health--;
                        if (enemy.health <= 0) {
                            spawnExplosion(enemy.x, enemy.y);
                            sounds.playExplosion();
                            score += Math.floor(enemy.radius * 5);
                            updateHUD();
                            enemyDestroyed = true;
                        }
                        break;
                    }
                }

                if (enemyDestroyed) {
                    enemies.splice(i, 1);
                    continue;
                }

                // Remove out of bounds enemies
                if (enemy.y > height + enemy.radius) {
                    enemies.splice(i, 1);
                }
            }

            // Update Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            requestAnimationFrame(gameLoop);
        }

        function triggerGameOver() {
            gameState = 'GAMEOVER';
            document.getElementById('finalScore').innerText = score;
            document.getElementById('gameOverScreen').classList.remove('hidden');
        }

        // --- Event Listeners for UI ---
        document.getElementById('startBtn').addEventListener('click', () => {
            sounds.init();
            gameState = 'PLAYING';
            document.getElementById('startScreen').classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => document.getElementById('startScreen').classList.add('hidden'), 300);
            resetGame();
            gameLoop();
        });

        document.getElementById('restartBtn').addEventListener('click', () => {
            sounds.init();
            document.getElementById('gameOverScreen').classList.add('opacity-0');
            setTimeout(() => {
                document.getElementById('gameOverScreen').classList.add('hidden');
                document.getElementById('gameOverScreen').classList.remove('opacity-0');
            }, 300);
            gameState = 'PLAYING';
            resetGame();
            gameLoop();
        });
    </script>
</body>
</html>
